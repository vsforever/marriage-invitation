<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Envelope embroidery shared by all flap and pocket layers.
       Ganesha is displayed separately beside the centred invocation. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B762F"/>
      <stop offset=".23" stop-color="#E6C875"/>
      <stop offset=".48" stop-color="#AF8435"/>
      <stop offset=".7" stop-color="#F5DFA0"/>
      <stop offset="1" stop-color="#9D772F"/>
    </linearGradient>
    <filter id="thread" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx=".45" dy=".65" stdDeviation=".35" flood-color="#705728" flood-opacity=".4"/>
    </filter>
    <pattern id="vine" width="30" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8Q8 0 15 8T30 8M4 7Q6 0 11 3Q10 8 4 7M19 9Q21 16 26 13Q25 8 19 9" stroke="url(#gold)" stroke-width=".8"/>
      <path d="M12 8L15 5L18 8L15 11Z" fill="#B69551"/>
    </pattern>
    <g id="feather">
      <path d="M0 0C-7 -17 -26 -28 -23 -45C-19 -65 17 -65 23 -45C28 -28 6 -15 0 0Z" fill="#667B68" fill-opacity=".18" stroke="url(#gold)" stroke-width="1"/>
      <path d="M0 0V-50M0 -9L-13 -28M0 -16L14 -34M0 -25L-18 -42M0 -32L17 -48" stroke="url(#gold)" stroke-width=".65"/>
      <ellipse cy="-43" rx="11" ry="14" fill="#687F70" fill-opacity=".6" stroke="url(#gold)" stroke-width="1.2"/>
      <path d="M0 -54C-10 -44 -7 -35 0 -32C8 -36 10 -46 0 -54Z" fill="#C8A654"/>
      <ellipse cy="-43" rx="4" ry="7" fill="#375B5C"/>
      <path d="M-2 -47Q1 -50 3 -45" stroke="#F1DB9B" stroke-width=".8"/>
    </g>
    <g id="flower" stroke="url(#gold)" stroke-width=".9" fill="#EBD9AE">
      <path d="M0 0C-21 -1 -22 -18 -10 -19C-8 -32 8 -32 10 -19C23 -18 21 -1 0 0Z"/>
      <path d="M0 0C-15 17 -29 7 -23 -3C-32 -13 -21 -25 -11 -18C1 -24 12 -11 0 0Z" transform="rotate(72)"/>
      <path d="M0 0C-15 17 -29 7 -23 -3C-32 -13 -21 -25 -11 -18C1 -24 12 -11 0 0Z" transform="rotate(144)"/>
      <circle r="7" fill="#AE873C"/><circle r="3" fill="#F9EAC3"/>
    </g>
    <g id="corner" filter="url(#thread)">
      <path d="M0 100Q-1 5 100 0M3 83Q12 12 83 3M8 64Q22 21 64 8" stroke="url(#gold)" stroke-width="1"/>
      <use href="#feather" transform="translate(36 40) rotate(-43) scale(.64)"/>
      <use href="#feather" transform="translate(50 32) rotate(-12) scale(.57)"/>
      <use href="#feather" transform="translate(31 53) rotate(-76) scale(.57)"/>
      <use href="#flower" transform="translate(29 30) scale(.42)"/>
      <path d="M10 74Q28 61 35 42M69 10Q57 28 42 35M14 59Q25 47 23 39M59 14Q47 25 39 23" stroke="url(#gold)" stroke-width="1.3"/>
      <g fill="#7E8E73" stroke="url(#gold)" stroke-width=".65">
        <path d="M14 65Q4 46 16 38Q24 51 14 65ZM23 52Q33 36 43 40Q35 53 23 52Z"/>
        <path d="M65 14Q46 4 38 16Q51 24 65 14ZM52 23Q36 33 40 43Q53 35 52 23Z"/>
      </g>
      <g fill="#C5A35A"><circle cx="10" cy="83" r="1.5"/><circle cx="83" cy="10" r="1.5"/><circle cx="13" cy="27" r="1.2"/><circle cx="27" cy="13" r="1.2"/></g>
    </g>
  </defs>

  <!-- Four visible embroidered edges and mirrored peacock-feather corners. -->
  <g filter="url(#thread)">
    <rect x="10" y="10" width="580" height="380" rx="4" stroke="url(#gold)" stroke-width="1.6"/>
    <rect x="28" y="28" width="544" height="344" rx="3" stroke="url(#gold)" stroke-width=".75"/>
    <rect x="33" y="33" width="534" height="334" rx="2" stroke="#B49455" stroke-width=".65" stroke-dasharray=".8 3"/>
    <rect x="112" y="10" width="376" height="16" fill="url(#vine)"/>
    <rect x="112" y="374" width="376" height="16" fill="url(#vine)"/>
    <rect x="112" y="-26" width="176" height="16" fill="url(#vine)" transform="rotate(90)"/>
    <rect x="112" y="-590" width="176" height="16" fill="url(#vine)" transform="rotate(90)"/>
  </g>
  <use href="#corner" transform="translate(14 14)"/>
  <use href="#corner" transform="translate(586 14) scale(-1 1)"/>
  <use href="#corner" transform="translate(14 386) scale(1 -1)"/>
  <use href="#corner" transform="translate(586 386) scale(-1 -1)"/>
</svg>
